spring:
  application:
    name: backend

  # docker-compose.yml 의 MySQL 컨테이너와 값이 같아야 한다
  datasource:
    url: jdbc:mysql://localhost:3306/ticketing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ticketing
    password: ticketing

  jpa:
    # 엔티티를 보고 테이블을 자동으로 만들거나 고친다 (개발용, 운영에서는 쓰지 않는다)
    hibernate:
      ddl-auto: update
    # 컨트롤러 응답이 끝날 때까지 DB 커넥션을 붙잡지 않도록 끈다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # 실행되는 SQL을 콘솔에 찍는다. 1단계 N+1 확인에 쓴다
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
